name: Build SIM Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SIMManager-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q SIMManager-source.zip -d project

      - name: Force Fix AI Hallucinations (Versions)
        working-directory: project/SIMManager
        run: |
          echo "=== 1. تصحيح إصدار Gradle الوهمي (9.6.0) ==="
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-[0-9.]*-/gradle-8.7-/g' {} +
          
          echo "=== 2. تصحيح إصدارات المكتبات الوهمية ==="
          # استبدال activity-compose الوهمي
          find . -type f \( -name "*.kts" -o -name "*.toml" -o -name "*.gradle" \) -exec sed -i 's/1.14.0/1.9.0/g' {} +
          # استبدال compose ui الوهمي
          find . -type f \( -name "*.kts" -o -name "*.toml" -o -name "*.gradle" \) -exec sed -i 's/1.12.1/1.6.8/g' {} +
          # استبدال material3 الوهمي
          find . -type f \( -name "*.kts" -o -name "*.toml" -o -name "*.gradle" \) -exec sed -i 's/1.4.0/1.2.1/g' {} +
          
          echo "=== 3. تصحيح إصدار AGP الوهمي لحل مشكلة Kotlin السابقة ==="
          find . -type f \( -name "*.kts" -o -name "*.toml" -o -name "*.gradle" \) -exec sed -i 's/version "9.0.0"/version "8.5.0"/g' {} +
          find . -type f \( -name "*.kts" -o -name "*.toml" -o -name "*.gradle" \) -exec sed -i 's/agp = "9.0.0"/agp = "8.5.0"/g' {} +
          
          echo "=== تم التصحيح بنجاح ==="

      - name: Grant permission to gradlew
        working-directory: project/SIMManager
        run: chmod +x gradlew

      - name: Build APK
        working-directory: project/SIMManager
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: project/SIMManager/**/build/reports/**

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIMManager-APK
          path: project/SIMManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
