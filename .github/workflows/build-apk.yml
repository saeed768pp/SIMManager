name: Build SIM Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SIMManager-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q SIMManager-source.zip -d project

      - name: Show Project Structure
        run: |
          echo "=== شكل المجلدات بعد فك الضغط ==="
          ls -la project/
          echo "=== محتويات مجلد SIMManager (إذا كان موجود) ==="
          ls -la project/SIMManager/ || echo "تحذير: مجلد SIMManager غير موجود!"

      - name: Fix AI Hallucinations (Force Correct Versions)
        working-directory: project/SIMManager
        run: |
          echo "=== جاري تصحيح إصدارات الذكاء الاصطناعي ==="
          
          # 1. تصحيح إصدار Gradle الوهمي (9.6.0) في جميع ملفات المشروع
          find . -type f \( -name "*.properties" -o -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/9.6.0/8.7/g' {} +
          
          # 2. تصحيح إصدار Kotlin لحل مشكلة (AgpWithBuiltInKotlinAppliedCheck)
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.22"/g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/kotlin_version = "[^"]*"/kotlin_version = "1.9.22"/g' {} +
          
          # 3. تصحيح إصدارات Androidx الوهمية
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/1.14.0/1.9.0/g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/1.12.1/1.6.8/g' {} +
          
          echo "=== تم التصحيح بنجاح ==="

      - name: Grant permission to gradlew
        working-directory: project/SIMManager
        run: chmod +x gradlew

      - name: Build APK
        working-directory: project/SIMManager
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: project/SIMManager/**/build/reports/**

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIMManager-APK
          path: project/SIMManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
