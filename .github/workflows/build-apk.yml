name: Build SIM Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SIMManager-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q SIMManager-source.zip -d project

      - name: Fix AI Hallucinations (Versions)
        working-directory: project/SIMManager
        run: |
          python3 -c '
          import os
          from pathlib import Path

          # 1. إصلاح إصدار Gradle الوهمي
          wrapper = Path("gradle/wrapper/gradle-wrapper.properties")
          if wrapper.exists():
              text = wrapper.read_text()
              text = text.replace("9.6.0", "8.7") 
              wrapper.write_text(text)

          # 2. إصلاح إصدارات Androidx الوهمية
          gradle_kts = Path("app/build.gradle.kts")
          if gradle_kts.exists():
              text = gradle_kts.read_text()
              text = text.replace("1.14.0", "1.9.0") 
              text = text.replace("1.12.1", "1.6.8") 
              gradle_kts.write_text(text)
          '

      - name: Grant permission to gradlew
        working-directory: project/SIMManager
        run: chmod +x gradlew

      - name: Build APK
        working-directory: project/SIMManager
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: project/SIMManager/**/build/reports/**

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIMManager-APK
          path: project/SIMManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
