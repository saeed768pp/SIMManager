name: Build SIM Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SIMManager-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q SIMManager-source.zip -d project

      - name: Build APK
        working-directory: project/SIMManager
        run: |
          python3 -c '
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")
          lines = [l for l in text.splitlines() if "org.jetbrains.kotlin.android" not in l]
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          '
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMManager-APK
          path: project/SIMManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
