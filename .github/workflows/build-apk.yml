name: Build SIM Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SIMManager-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q SIMManager-source.zip -d project

      - name: Patch Project (Fix AI Mistakes)
        working-directory: project/SIMManager
        run: |
          python3 -c '
          import re
          from pathlib import Path

          # 1. تصحيح إصدار Gradle الوهمي (9.6.0) إلى إصدار حقيقي (8.7)
          wrapper = Path("gradle/wrapper/gradle-wrapper.properties")
          if wrapper.exists():
              text = wrapper.read_text()
              text = re.sub(r"gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-", "gradle-8.7-", text)
              wrapper.write_text(text)

          # 2. حذف الـ Kotlin Plugin الذي يسبب المشكلة بناءً على طلب الخطأ
          files_to_patch = [Path("app/build.gradle.kts"), Path("build.gradle.kts")]
          
          for file in files_to_patch:
              if file.exists():
                  text = file.read_text()
                  # مسح أي سطر يحتوي على org.jetbrains.kotlin.android
                  lines = [l for l in text.splitlines() if "org.jetbrains.kotlin.android" not in l]
                  file.write_text("\n".join(lines) + "\n")
                  print(f"تم تنظيف الملف: {file}")
          '

      - name: Grant permission to gradlew
        working-directory: project/SIMManager
        run: chmod +x gradlew

      - name: Build APK
        working-directory: project/SIMManager
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: project/SIMManager/**/build/reports/**

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIMManager-APK
          path: project/SIMManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
