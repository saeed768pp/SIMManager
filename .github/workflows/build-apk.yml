
name: Build SIM Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SIMManager-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android platform
        run: sdkmanager 'platform-tools' 'platforms;android-36'

      - name: Extract project
        run: unzip -q SIMManager-source.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        working-directory: project/SIMManager
        run: gradle assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMManager-APK
          path: project/SIMManager/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
